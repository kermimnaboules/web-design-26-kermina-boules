phone = 010.012,011', 11 number
courses =data list
img= .png
comment = 20 to 100 letters only
date =required 
id = numbers -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form autocomplete="off">
        <div>
            <label>First Name:</label>
        <input type="text" pattern="[A-Za-z]{2,5} " name="firstName">
        </div>
        <div>
            <label>Phone:</label>
            <input type="number" name="phone" maxlength="11"
            minlength="11" pattern=[011,012,010]>
        </div>
        <div>
            <label>
                Courses
            </label>
            <input type="checkbox" name="courses" ><label>forntend</label>
            <input type="checkbox" name="courses" ><label>backend</label>
            <input type="checkbox" name="courses" ><label>Network</label>
        
         </div>
         <div>
            <label>images</label>
            <input type="file" name="image" pattern=".png">
         </div>
         <div>
            <label>
                comment
            </label>
            <input type="text" name="comment" minlength="20" maxlength="100"
            pattern=[A-Za-z]>
         </div>
         <div>
            <input type="date" required>
         </div>
         <div>
            <label for="ID">id</label>
            <input type="text" id="ID" name="ID">
         </div>
         <button>
            Submit
         </button>
    </form>
    
</body>
</html>
